name: blaxzy

# LOCAL DEVELOPMENT ONLY: fixed dev credentials, ports bound to 127.0.0.1, no TLS, no backups.
# Do not use this file for staging or production (managed Postgres and a real S3 store there).

# NOTE: the official minio/minio images are no longer published on Docker Hub/Quay, so the
# S3-compatible store is RustFS. The service keeps the name "minio" and the MINIO_* port
# variables so it can be swapped for any S3 server without touching the rest of the repo.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: blaxzy
      POSTGRES_USER: blaxzy
      POSTGRES_PASSWORD: blaxzy
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blaxzy -d blaxzy"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: blaxzy
      RUSTFS_SECRET_KEY: blaxzy-secret
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9100}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: amazon/aws-cli:2.39.7
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: blaxzy
      AWS_SECRET_ACCESS_KEY: blaxzy-secret
      AWS_DEFAULT_REGION: us-east-1
      # Browsers PUT uploads straight to presigned URLs, so the bucket must allow the app's
      # origins (comma-separated). Re-run with `docker compose up --no-deps minio-init`.
      S3_CORS_ORIGINS: ${S3_CORS_ORIGINS:-http://localhost:3000}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket blaxzy 2>/dev/null ||
          aws --endpoint-url http://minio:9000 s3api create-bucket --bucket blaxzy
        origins=$$(printf '%s' "$$S3_CORS_ORIGINS" | sed 's/[^,][^,]*/"&"/g')
        aws --endpoint-url http://minio:9000 s3api put-bucket-cors --bucket blaxzy --cors-configuration \
          "{\"CORSRules\":[{\"AllowedOrigins\":[$$origins],\"AllowedMethods\":[\"GET\",\"PUT\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3600}]}"
        echo "bucket blaxzy ready; CORS origins: $$S3_CORS_ORIGINS"

  # --- Error tracking (profile "observability"): GlitchTip, a self-hosted, Sentry-compatible ----
  # tracker. Not started by a plain `docker compose up -d`; start it with
  # `docker compose --profile observability up -d`, then open http://localhost:8000 (README,
  # "Error tracking"). It has its own Postgres and Valkey, separate from the app's.
  glitchtip-postgres:
    profiles: ["observability"]
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
    volumes:
      - glitchtip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 5s
      timeout: 5s
      retries: 10

  glitchtip-valkey:
    profiles: ["observability"]
    image: valkey/valkey:9.0.8-alpine
    restart: unless-stopped

  glitchtip-migrate:
    profiles: ["observability"]
    image: glitchtip/glitchtip:6.2.6
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
    restart: "no"
    environment: &glitchtip-environment
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      VALKEY_URL: redis://glitchtip-valkey:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-local-dev-only-glitchtip-secret-change-me}
      GLITCHTIP_DOMAIN: http://localhost:${GLITCHTIP_PORT:-8000}
      DEFAULT_FROM_EMAIL: glitchtip@blaxzy.local
      EMAIL_URL: consolemail://
      PORT: "8000"
      ENABLE_USER_REGISTRATION: "true"
      ENABLE_ORGANIZATION_CREATION: "true"
    command: ./bin/run-migrate.sh

  glitchtip-web:
    profiles: ["observability"]
    image: glitchtip/glitchtip:6.2.6
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
      glitchtip-valkey:
        condition: service_started
    restart: unless-stopped
    environment:
      <<: *glitchtip-environment
      SERVER_ROLE: web
    ports:
      - "127.0.0.1:${GLITCHTIP_PORT:-8000}:8000"
    volumes:
      - glitchtip_uploads:/code/uploads

  glitchtip-worker:
    profiles: ["observability"]
    image: glitchtip/glitchtip:6.2.6
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
      glitchtip-valkey:
        condition: service_started
    restart: unless-stopped
    environment:
      <<: *glitchtip-environment
      SERVER_ROLE: worker
    volumes:
      - glitchtip_uploads:/code/uploads
  # --- end error tracking ----------------------------------------------------------------------

volumes:
  postgres_data:
  minio_data:
  glitchtip_postgres_data:
  glitchtip_uploads:
