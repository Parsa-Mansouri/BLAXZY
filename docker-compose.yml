name: blaxzy

# NOTE: the official minio/minio images are no longer published on Docker Hub/Quay, so the
# S3-compatible store is RustFS. The service keeps the name "minio" and the MINIO_* port
# variables so it can be swapped for any S3 server without touching the rest of the repo.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: blaxzy
      POSTGRES_USER: blaxzy
      POSTGRES_PASSWORD: blaxzy
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blaxzy -d blaxzy"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: blaxzy
      RUSTFS_SECRET_KEY: blaxzy-secret
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: amazon/aws-cli:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: blaxzy
      AWS_SECRET_ACCESS_KEY: blaxzy-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket blaxzy 2>/dev/null ||
        aws --endpoint-url http://minio:9000 s3api create-bucket --bucket blaxzy

volumes:
  postgres_data:
  minio_data:
